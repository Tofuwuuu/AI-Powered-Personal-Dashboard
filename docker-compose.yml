version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ['6379:6379']

  api:
    build: { context: ./backend }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: [.env]
    ports: ['8000:8000']
    volumes: ['./backend:/app']
    depends_on: [db, redis]

  worker:
    build: { context: ./backend }
    command: celery -A app.workers.tasks.celery_app worker --loglevel=info
    env_file: [.env]
    volumes: ['./backend:/app']
    depends_on: [db, redis]

  frontend:
    build: { context: ./frontend }
    command: npm run dev -- --host 0.0.0.0 --port 5173
    env_file: [.env]
    ports: ['5173:5173']
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: [api]

volumes:
  pgdata:
